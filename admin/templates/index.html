<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>josevu-blog admin</title>
<style>
  :root {
    --bg: #faf9f6; --panel: #fff; --border: #e5e5e5; --text: #222; --muted: #6b6b6b;
    --accent: #268bd2; --danger: #c0392b; --code-bg: #f4f4f4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); background: var(--bg); }
  .app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
  .sidebar { background: #1f1f1f; color: #eee; display: flex; flex-direction: column; min-height: 0; }
  .sidebar header { padding: 18px 18px 12px; border-bottom: 1px solid #333; }
  .sidebar header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .sidebar header .sub { font-size: 12px; color: #999; margin-top: 2px; }
  .new-btn { margin: 14px 18px 0; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  .new-btn:hover { filter: brightness(1.08); }
  .post-list { list-style: none; margin: 12px 0 0; padding: 0; overflow-y: auto; flex: 1; }
  .post-list li { padding: 10px 18px; cursor: pointer; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; gap: 8px; }
  .post-list li:hover { background: #2a2a2a; }
  .post-list li.active { background: #2d2d2d; border-left: 3px solid var(--accent); padding-left: 15px; }
  .post-list li .t { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .post-list li .draft { font-size: 10px; background: #444; color: #ddd; padding: 1px 6px; border-radius: 4px; }
  .post-list li .del { color: #888; cursor: pointer; font-size: 14px; padding: 2px 4px; border-radius: 4px; }
  .post-list li .del:hover { color: var(--danger); background: #333; }
  .sidebar footer { padding: 12px 18px; border-top: 1px solid #333; font-size: 12px; color: #999; display: flex; align-items: center; gap: 8px; }
  .sidebar footer img { width: 26px; height: 26px; border-radius: 50%; }
  .sidebar footer .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidebar footer a { color: #888; text-decoration: none; }
  .sidebar footer a:hover { color: #ccc; }
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .topbar input.title { flex: 1; font-size: 22px; font-weight: 600; border: 0; outline: 0; background: transparent; }
  .topbar input.title::placeholder { color: #bbb; }
  .topbar label.draft { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .topbar .save { padding: 9px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  .topbar .save:hover { filter: brightness(1.08); }
  .topbar .save:disabled { opacity: .5; cursor: default; }
  .toolbar { display: flex; gap: 4px; padding: 8px 24px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  .toolbar button { background: #f0f0f0; border: 1px solid #e0e0e0; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 14px; color: var(--text); }
  .toolbar button:hover { background: #e6e6e6; }
  .toolbar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .toolbar .sep { width: 1px; background: var(--border); margin: 2px 4px; }
  .editor-wrap { flex: 1; overflow-y: auto; padding: 24px 0; }
  .editor { max-width: 760px; margin: 0 auto; padding: 0 24px 80px; }
  .ProseMirror { min-height: 60vh; outline: 0; font-size: 17px; line-height: 1.65; }
  .ProseMirror:focus { outline: 0; }
  .ProseMirror h1 { font-size: 1.9em; margin: 1em 0 .5em; }
  .ProseMirror h2 { font-size: 1.5em; margin: 1em 0 .5em; }
  .ProseMirror h3 { font-size: 1.25em; margin: 1em 0 .5em; }
  .ProseMirror p { margin: .6em 0; }
  .ProseMirror ul, .ProseMirror ol { padding-left: 1.5em; }
  .ProseMirror li { margin: .25em 0; }
  .ProseMirror blockquote { border-left: 4px solid var(--accent); margin: .8em 0; padding: .2em 0 .2em 1em; color: var(--muted); }
  .ProseMirror pre { background: #272822; color: #f8f8f2; padding: 14px 16px; border-radius: 8px; overflow-x: auto; font-size: 14px; }
  .ProseMirror code { background: var(--code-bg); padding: 2px 5px; border-radius: 4px; font-size: .92em; }
  .ProseMirror pre code { background: transparent; padding: 0; }
  .ProseMirror img { max-width: 100%; height: auto; border-radius: 8px; margin: .5em 0; }
  .ProseMirror a { color: var(--accent); }
  .ProseMirror.is-empty::before { content: attr(data-placeholder); color: #bbb; pointer-events: none; float: left; height: 0; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #222; color: #fff; padding: 12px 18px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25); opacity: 0; transform: translateY(10px); transition: .2s; max-width: 360px; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { background: var(--danger); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header>
      <h1>josevu-blog</h1>
      <div class="sub">admin</div>
    </header>
    <button class="new-btn" id="newBtn">+ New post</button>
    <ul class="post-list" id="postList"></ul>
    <footer id="userBox"></footer>
  </aside>
  <main class="main">
    <div class="topbar">
      <input class="title" id="title" placeholder="Post title...">
      <label class="draft"><input type="checkbox" id="draft"> Draft</label>
      <button class="save" id="saveBtn">Publish</button>
    </div>
    <div class="toolbar" id="toolbar">
      <button data-cmd="h1" title="Heading 1">H1</button>
      <button data-cmd="h2" title="Heading 2">H2</button>
      <button data-cmd="h3" title="Heading 3">H3</button>
      <span class="sep"></span>
      <button data-cmd="bold" title="Bold" style="font-weight:700">B</button>
      <button data-cmd="italic" title="Italic" style="font-style:italic">I</button>
      <button data-cmd="code" title="Inline code">&lt;/&gt;</button>
      <span class="sep"></span>
      <button data-cmd="bulletList" title="Bullet list">List</button>
      <button data-cmd="orderedList" title="Numbered list">1.</button>
      <button data-cmd="blockquote" title="Quote">Quote</button>
      <span class="sep"></span>
      <button data-cmd="link" title="Link">Link</button>
      <button data-cmd="image" title="Insert image">Image</button>
    </div>
    <div class="editor-wrap">
      <div class="editor" id="editor"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="filePicker" accept="image/*" style="display:none">
<script src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script type="module" src="/editor.js"></script>
</body>
</html>
